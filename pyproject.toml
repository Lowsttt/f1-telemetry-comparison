[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W : style PEP 8, F : erreurs (variables inutilisées...), I : ordre des imports,
# B : pièges courants (bugbear), UP : syntaxe Python moderne
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
